[package]
name = "entropy-client"
version = "0.1.0"
description = "Entropy — Secure Communication Client"
authors = ["Pablo Durán Celis <duran.pablo.c@gmail.com>"]
edition = "2021"

[lib]
name = "entropy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "entropy-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# quinn = "0.11"  # TODO: add quinn when version conflicts resolve
cpal = "0.15"
# audiopus = "0.2"  # TODO: add audiopus when libopus/autoconf is available on the build system
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
